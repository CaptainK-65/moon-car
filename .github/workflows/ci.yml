name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon version --all
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon build --target all
      - run: moon test --target all
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code -- pkg.generated.mbti
      - run: moon run examples/pack
      - run: moon run examples/stream
      - run: moon run examples/lookup
      - run: moon run cmd/mooncar --target native -- verify fixtures/carv1-basic.car
  fixture-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - run: moon run tools/verify_fixture.mbtx --target native
      - run: moon run tools/embed_fixture.mbtx
      - run: moon fmt
      - run: git diff --exit-code -- fixture_bytes_test.mbt
      - name: Published package consumer (wasm)
        run: moon run tools/verify_published.mbtx --target wasm
      - name: Published package consumer (wasm-gc)
        run: moon run tools/verify_published.mbtx --target wasm-gc
      - name: Published package consumer (JS)
        run: moon run tools/verify_published.mbtx --target js
      - name: Published package consumer (native)
        run: moon run tools/verify_published.mbtx --target native
